cart.selectOneById: >
  SELECT id, customer_id, status, created_at, updated_at
  FROM CART
  WHERE environment_id = (?)::env_id AND tenant_id = (?)::ulid AND id = (?)::ulid;

cart.insert: >
  INSERT INTO CART (environment_id, tenant_id, id, customer_id, status)
    VALUES ((?)::env_id, (?)::ulid, (?)::ulid, (?)::ulid, ?);

cart.item.selectCartItemsByCartId: >
  SELECT id, cart_id, product_id, quantity, item_price
  FROM CART_ITEM
  WHERE environment_id = (?)::env_id AND tenant_id = (?)::ulid AND cart_id = (?)::ulid;

cart.item.insert: >
  INSERT INTO CART_ITEM (environment_id, tenant_id, id, cart_id, product_id, quantity, item_price)
    VALUES ((?)::env_id, (?)::ulid, (?)::ulid, (?)::ulid, (?)::ulid, ?, ?);

cart.update: >
  UPDATE CART
  SET status = ?, updated_at = NOW()
  WHERE environment_id = (?)::env_id AND tenant_id = (?)::ulid AND id = (?)::ulid;

cart.item.update: >
  UPDATE CART_ITEM
  SET quantity = ?, item_price = ?, updated_at = NOW()
  WHERE environment_id = (?)::env_id AND tenant_id = (?)::ulid AND id = (?)::ulid;

