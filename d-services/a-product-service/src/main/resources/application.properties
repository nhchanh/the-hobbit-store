# Spring Boot Application Configuration for The Hobbit Online Store Service

# Server
server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/online-shopping-db
spring.datasource.username=online-shopping-user
spring.datasource.password=password

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA (Hibernate is not used, but these are safe defaults for Spring Boot)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.org.springframework=INFO
logging.level.chanhnguyen.hoppy.thehobbitstore=DEBUG
